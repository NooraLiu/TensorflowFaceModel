<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Face Tracking - Object-Oriented Sketch.js Recreation</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #video { 
      position: absolute;
      top: 10px;
      right: 10px;
      width: 320px;
      height: 240px;
      border: 2px solid #fff;
      border-radius: 8px;
      z-index: 1000;
    }
    #mesh-canvas {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 320px;
      height: 240px;
      border: 2px solid #fff;
      border-radius: 8px;
      z-index: 1001;
      pointer-events: none;
    }
    #error { 
      position: absolute; 
      top: 10px; 
      left: 10px; 
      color: red; 
      background: rgba(0,0,0,0.8); 
      padding: 10px; 
      border-radius: 5px;
      display: none;
      z-index: 1001;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      z-index: 1000;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="error"></div>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="mesh-canvas" width="320" height="240"></canvas>
  <div id="controls">
    <div><strong>Basic Face Controls (OOP):</strong></div>
    <div>Head Left/Right: Rotate cube</div>
    <div>Head Forward/Back: Tilt cube</div>
    <div>Head Side Tilt: Roll cube</div>
    <div>Open Mouth: Scale cube size</div>
    <div>Raise Eyebrows: Toggle wireframe</div>
    <div>Blink: Spawn colored circles</div>
    <div id="calibration-status" style="margin-top: 8px; color: #FFD700;">
      Calibrating face baseline...
    </div>
    <div style="margin-top: 8px; font-size: 10px;">
      <span style="color: #FFFF00;">●</span> Head tracking<br>
      <span style="color: #FF00FF;">●</span> Mouth tracking<br>
      <span style="color: #00FF88;">●</span> Eyebrow tracking
    </div>
  </div>

  <!-- Load MediaPipe FaceMesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <!-- Our Object-Oriented Basic App -->
  <script type="module" src="./basicApp.js"></script>
  
  <!-- Navigation button -->
  <button id="nav-button" onclick="goToMovementControl()" style="
    position: absolute;
    bottom: 20px;
    left: 20px;
    padding: 12px 20px;
    background: linear-gradient(45deg, #4ECDC4, #FF6B6B);
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    z-index: 100;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(0, 0, 0, 0.4)'" 
     onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(0, 0, 0, 0.3)'"
     onmousedown="this.style.transform='translateY(0)'">
    Switch to Movement Control
  </button>
  
  <script>
    function goToMovementControl() {
      window.location.href = 'movement.html';
    }
  </script>
</body>
</html>
